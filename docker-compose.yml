services:
  db:
    image: postgres:16-alpine
    container_name: news-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsapp
      POSTGRES_PASSWORD: newsapp_secret
      POSTGRES_DB: newsapp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
